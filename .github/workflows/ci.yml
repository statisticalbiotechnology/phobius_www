name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install BLAST+ and Kalign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ncbi-blast+ kalign

      - name: Install the package
        run: pip install -e ".[dev]"

      - name: Run tests
        # Engine-dependent tests skip cleanly here: phobius.model is licensed and
        # is not in the repository. They run against the built image below.
        run: pytest -q


  publish:
    name: Build, verify and publish to GHCR
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    env:
      # Published as ghcr.io/<owner>/phobius. The image is linked back to this
      # repository through the org.opencontainers.image.source label that
      # metadata-action sets, so the package name need not match the repo name.
      IMAGE: ghcr.io/${{ github.repository_owner }}/phobius

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Phobius
            org.opencontainers.image.description=Combined transmembrane topology and signal peptide prediction
            org.opencontainers.image.licenses=GPL-2.0-or-later

      # Build into the local daemon first. Nothing is pushed until the checks
      # below pass -- a licensed file that reached GHCR could not be un-published.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: phobius:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify no licensed file is in the image
        run: |
          # Capture rather than pipe into grep: `grep -q` closes the pipe on its
          # first match, docker dies with SIGPIPE, and the default `-o pipefail`
          # would turn that into a *failed* condition -- silently passing the
          # very case this step exists to catch.
          status=0
          for f in phobius.model phobius.options decodeanhmm; do
            # `|| true` matters: running as UID 1000, find hits unreadable
            # directories and exits 1 even with stderr discarded, which under
            # `set -e` would abort this step before it reported anything.
            found=$(docker run --rm --entrypoint sh phobius:candidate \
                      -c "find / -name '$f' -not -path '/mnt/*' -print -quit 2>/dev/null || true")
            if [ -n "$found" ]; then
              echo "::error::licensed file '$f' is present in the image at $found"
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then
            echo "No licensed files in the image."
          fi
          exit "$status"

      - name: Verify the image runs as UID 1000
        # SciLifeLab Serve requires a non-root user with UID 1000; any other UID
        # needs approval from the platform team.
        run: |
          uid=$(docker run --rm --entrypoint id phobius:candidate -u)
          echo "image runs as uid $uid"
          [ "$uid" = "1000" ] || { echo "::error::image runs as uid $uid, Serve requires 1000"; exit 1; }

      - name: Verify the Serve start-up script
        # SciLifeLab Serve launches the container by running ./start-script.sh
        # from the image WORKDIR. A missing or non-executable script fails at
        # deploy time with "/bin/sh: 1: ./start-script.sh: not found", which no
        # amount of local `docker run` would reveal, because that path uses the
        # ENTRYPOINT instead.
        run: |
          workdir=$(docker image inspect phobius:candidate --format '{{.Config.WorkingDir}}')
          entrypoint=$(docker image inspect phobius:candidate --format '{{json .Config.Entrypoint}}')
          echo "WORKDIR:    ${workdir:-<empty>}"
          echo "ENTRYPOINT: $entrypoint"

          if [ -z "$workdir" ]; then
            echo "::error::the image has no WORKDIR; Serve needs one to find the start-up script"
            exit 1
          fi
          if ! docker run --rm --entrypoint sh phobius:candidate -c '[ -x ./start-script.sh ]'; then
            echo "::error::./start-script.sh is missing or not executable at $workdir"
            exit 1
          fi
          echo "start-script.sh is present and executable at $workdir"

      - name: Smoke-test the image
        # A placeholder model is enough to start the service; the licensed file
        # is only needed to make an actual prediction, which the tests cover.
        run: |
          mkdir -p "$RUNNER_TEMP/mnt" && : > "$RUNNER_TEMP/mnt/phobius.model"
          # Start it exactly as Serve does -- overriding the entrypoint and
          # invoking the script by path -- so this covers the real launch path.
          docker run -d --name smoke -p 8000:8000 -v "$RUNNER_TEMP/mnt:/mnt/data:ro" \
            --entrypoint /bin/sh phobius:candidate -c './start-script.sh'

          for _ in $(seq 30); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          fail=0
          for path in /healthz / /instructions /static/style.css /docs; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000$path")
            echo "  $path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::smoke test failed"
            docker logs smoke
          fi
          docker rm -f smoke >/dev/null
          exit "$fail"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same context and cache as the verified build, so this re-uses those
          # layers rather than building anything new.
          cache-from: type=gha

      # Provenance attestation requires a public repository (or a paid plan for
      # private ones), and runs after the image is already pushed -- so it is
      # skipped rather than allowed to turn a successful publish red. It starts
      # working by itself once the repository is made public, which SciLifeLab
      # Serve requires anyway.
      - name: Attest build provenance
        if: github.event_name == 'push' && github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: github.event_name == 'push'
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "> On the first push the GHCR package is **private**. Make it public"
            echo "> under Packages → phobius → Package settings, otherwise"
            echo "> SciLifeLab Serve cannot pull it."
          } >> "$GITHUB_STEP_SUMMARY"
